    <style>
      .app-bootloader-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ebe6dc;
        font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
        z-index: 99999;
        padding: 16px;
        box-sizing: border-box;
      }
      .bootloader-wrapper {
        width: 100%;
        max-width: 440px;
        background-color: #181b20;
        border: 2px solid #1c1917;
        box-shadow: 6px 6px 0px #1c1917;
        color: #f5f5f4;
        overflow: hidden;
        box-sizing: border-box;
      }
      .boot-header {
        background-color: #23272e;
        border-bottom: 2px solid #1c1917;
        padding: 9px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #fbbf24;
      }
      .boot-header-dots {
        display: flex;
        gap: 6px;
      }
      .boot-dot {
        width: 9px;
        height: 9px;
        border: 1px solid #1c1917;
        border-radius: 1px;
      }
      .boot-dot-red { background: #ef4444; }
      .boot-dot-amber { background: #f59e0b; }
      .boot-dot-cyan { background: #06b6d4; }

      .boot-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .boot-logo-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .boot-logo-box {
        width: 44px;
        height: 44px;
        background: #23272e;
        border: 2px solid #1c1917;
        box-shadow: 2px 2px 0px #f59e0b;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        animation: boot-pulse 2s ease-in-out infinite;
      }
      .boot-title {
        font-size: 15px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.04em;
      }
      .boot-subtitle {
        font-size: 11px;
        color: #a8a29e;
        margin-top: 2px;
      }
      .boot-console {
        background: #0f1217;
        border: 1px solid #292524;
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.6;
        color: #a8a29e;
        border-left: 3px solid #f59e0b;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .boot-log-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .boot-ok-badge {
        color: #10b981;
        font-weight: 700;
      }
      .boot-active-badge {
        color: #f59e0b;
        font-weight: 700;
      }
      .boot-progress-track {
        height: 14px;
        background: #090b0e;
        border: 1px solid #292524;
        padding: 2px;
        box-sizing: border-box;
      }
      .boot-progress-bar {
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          #f59e0b,
          #f59e0b 8px,
          #181b20 8px,
          #181b20 10px
        );
        width: 0%;
        animation: boot-fill 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .boot-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: #78716c;
      }
      .boot-cursor {
        display: inline-block;
        width: 7px;
        height: 12px;
        background: #f59e0b;
        vertical-align: middle;
        margin-left: 4px;
        animation: boot-blink 0.8s infinite;
      }
      @keyframes boot-fill {
        0% { width: 10%; }
        25% { width: 42%; }
        60% { width: 75%; }
        85% { width: 92%; }
        100% { width: 100%; }
      }
      @keyframes boot-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.3)); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6)); }
      }
