<!-- Fixed Viewport Retro Grid Background -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
  <om-retro-grid
    [gridColor]="'#f59e0b'"
    [fadeColor]="'#ebe6dc'"
    [gridRotation]="'45deg'"
    styleClass="w-full h-full"
  ></om-retro-grid>
</div>

<!-- Main Workstation & Knowledge Flow -->
<div class="relative z-10 min-h-screen p-3 sm:p-6 lg:p-8 font-sans selection:bg-[#f59e0b] selection:text-black">
  <div class="max-w-7xl mx-auto space-y-4">
    <!-- Retro Workstation Header -->
    <app-retro-header
      [hasImage]="!!state.originalImage()"
      (loadSample)="loadSamplePreset()"
      (clear)="handleClear()"
      (scrollToGuide)="scrollToGuide()"
      (startTour)="startGuidedTour()"
    ></app-retro-header>

    <!-- Interactive Automated Guided Walkthrough Banner -->
    @if (tourService.isTourActive() && state.originalImage()) {
      <app-guided-tour
        [currentStep]="tourService.currentStep()"
        [totalSteps]="4"
        [currentStepInfo]="tourService.currentTourStepInfo()"
        [autoPlay]="tourService.autoPlay()"
        [revertCountdown]="tourService.revertCountdown()"
        [isSample]="state.isSampleImage()"
        (nextStep)="tourService.advanceTourStep()"
        (prevStep)="tourService.retreatTourStep()"
        (toggleAutoPlay)="tourService.toggleAutoPlay()"
        (finishTour)="tourService.onTourFinish()"
        (stayAndEdit)="tourService.stopGuidedTour()"
      ></app-guided-tour>
    }

    <!-- State A: No Image Uploaded Yet -->
    @if (!state.originalImage()) {
      <app-image-uploader
        (imageSelected)="state.handleImageFile($event, false)"
        (sampleSelected)="handleSampleSelected($event)"
      ></app-image-uploader>
    }

    <!-- State B: Image Loaded - Full Interactive Workstation -->
    @if (state.originalImage() && state.loadedImageElement()) {
      <app-workstation></app-workstation>
    }

    <!-- SEO & Knowledge Base Guide Section -->
    <app-seo-guide-section></app-seo-guide-section>
  </div>
</div>
